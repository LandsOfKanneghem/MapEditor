<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Редактор карты</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mapLibrary.css">
  <link rel="stylesheet" href="equipmentEditor.css">
  <script src="mapObjects.js" defer></script>
  <script src="equipmentCatalog.js" defer></script>
  <script src="mapEquipment.js" defer></script>
  <script src="mapData.js" defer></script>
  <script src="equipmentModel.js" defer></script>
  <script src="equipmentEditor.js" defer></script>
  <script src="undergroundRenderer.js" defer></script>
  <script src="mapLibrary.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="editor">
    <div class="editor-toolbar" role="toolbar" aria-label="Панель инструментов">
      <button type="button" id="load-map" class="toolbar-button" aria-label="Загрузить карту" title="Загрузить карту" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M3 19V5h7l2 3h9v4M3 19l3-9h16l-3 9Z"/>
        </svg>
      </button>
      <button type="button" id="save-map" class="toolbar-button" aria-label="Сохранить карту" title="Сохранить карту" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M4 3h13l4 4v14H3V3Z"/>
          <path d="M7 3v6h10V3M7 21v-8h10v8M14 4v3"/>
        </svg>
      </button>
      <button type="button" id="toggle-grid" class="toolbar-button" aria-label="Сетка" aria-pressed="true" aria-controls="map-grid" title="Показать/скрыть сетку">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 3v18M12 3v18M18 3v18M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="terrain" aria-label="Редактирование террейна" title="Редактирование террейна" aria-pressed="true" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="m14 4 3-2 5 5-2 3-8 8-5-5ZM7 14c-5 0-1 6-5 7 6 2 11-1 8-5"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="mobs" aria-label="Размещение врагов" title="Размещение врагов" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <ellipse cx="6" cy="7" rx="2" ry="3"/><ellipse cx="12" cy="5" rx="2" ry="3"/><ellipse cx="18" cy="7" rx="2" ry="3"/>
          <path d="M5 18c0-3 4-8 7-8s7 5 7 8c0 5-5 2-7 2s-7 3-7-2Z"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="allies" aria-label="Размещение союзников" title="Размещение союзников" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M5 22V3M5 4c5-5 9 5 15 0v11c-6 5-10-5-15 0"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="objects" aria-label="Массивные объекты" title="Массивные объекты" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="m3 6 9-3 9 3v13l-9 3-9-3ZM3 6l9 3 9-3M12 9v13M5 10l5 9M5 18l5-7M14 11l5 7M14 19l5-9"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="small-objects" aria-label="Небольшие объекты" title="Небольшие объекты" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 Q18 7 16 11 Q12 16 8 11 Q6 8 12 2Z" fill="#ffc94a" stroke="#a95b1d"/><path d="M10 13H14L13 22H11Z" fill="#8e5a2b" stroke="#d9ba76"/></svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="lighting" aria-label="Освещение" title="Освещение карты" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4 4l2 2M18 18l2 2M4 20l2-2M18 6l2-2M12 7v10"/>
          <path d="M12 7a5 5 0 0 1 0 10Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button type="button" id="toggle-level" class="toolbar-button" aria-label="На земле" title="Создать карту под землёй — очистить текущую" aria-pressed="false" disabled>
        <svg class="surface-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="10" r="4"/><path d="M12 1v3M12 16v3M3 10H0M21 10h3M4 2l3 3M17 15l3 3M20 2l-3 3M7 15l-3 3M1 22h22"/>
        </svg>
        <svg class="underground-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 4h20M4 22V12a8 8 0 0 1 16 0v10M8 22V12a4 4 0 0 1 8 0v10M1 22h22M4 12h4M16 12h4M6 7l3 3M15 10l3-3M12 4v4"/>
        </svg>
      </button>
      <button type="button" id="delete-selection" class="toolbar-button" aria-label="Удалить выделенное" title="Удалить выделенное" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <input type="file" id="map-file" accept=".json,application/json" hidden>
    <section class="map-panel" aria-label="Карта">
      <div class="map-viewport">
        <div class="map-surface" data-mode="terrain" aria-busy="true">
          <canvas id="map" width="576" height="576" tabindex="0" aria-label="Карта 12 на 12 клеток" aria-describedby="keyboard-help"></canvas>
          <div id="map-grid" class="map-grid" aria-hidden="true"></div>
          <div id="object-layer" class="object-layer"></div>
          <div id="mob-layer" class="mob-layer"></div>
          <div id="mob-drop-target" class="mob-drop-target" hidden aria-hidden="true"></div>
          <div id="keyboard-cursor" class="keyboard-cursor" aria-hidden="true"></div>
        </div>
      </div>
      <p id="status" role="status">Загрузка тайлов…</p>
      <span id="keyboard-help" class="sr-only">С клавиатуры: стрелки выбирают клетку, пробел или Enter применяет выбранный инструмент.</span>
    </section>
    <aside class="terrain-panel" aria-labelledby="terrain-title">
      <h2 id="terrain-title">Террейн</h2>
      <div id="terrain-palette" class="terrain-list" role="group" aria-label="Выбор террейна">
        <button type="button" class="terrain-option" data-terrain="grass" aria-label="Трава" title="Трава" aria-pressed="true" disabled>
          <span class="terrain-swatch terrain-swatch--grass" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="sand" aria-label="Песок" title="Песок" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--sand" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="dirt" aria-label="Грязь" title="Грязь" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--dirt" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="swamp" aria-label="Болото" title="Болото" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--swamp" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="shallow-water" aria-label="Мелководье" title="Мелководье" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--shallow-water" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="deep-water" aria-label="Глубоководье" title="Глубоководье" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--water" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="monastery-floor" aria-label="Пол монастыря" title="Пол монастыря" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--monastery-floor" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="cave-earth" aria-label="Пещерный пол" title="Пещерный пол" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--cave-earth" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="void" aria-label="Пустота" title="Пустота — убрать пол" aria-pressed="false" hidden disabled>
          <span class="terrain-swatch terrain-swatch--void" aria-hidden="true"></span>
        </button>
      </div>
      <section id="wall-palette" aria-label="Стиль стен" hidden>
        <h3>Стены</h3>
        <div class="terrain-list">
          <button type="button" class="terrain-option" data-wall="monastery" aria-label="Стена монастыря" title="Стена монастыря" aria-pressed="true" disabled>
            <img class="object-swatch" src="assets/terrain/wall-monastery.png" alt="" width="48" height="48" draggable="false">
          </button>
          <button type="button" class="terrain-option" data-wall="dungeon" aria-label="Стена подземелья" title="Стена подземелья" aria-pressed="false" disabled>
            <img class="object-swatch" src="assets/terrain/wall-dungeon.png" alt="" width="48" height="48" draggable="false">
          </button>
        </div>
      </section>
      <section id="lighting-palette" class="lighting-panel" aria-label="Настройки освещения" hidden>
        <label for="ambient-brightness">Общая яркость <output id="ambient-value" for="ambient-brightness">100%</output></label>
        <input id="ambient-brightness" type="range" min="60" max="120" step="1" value="100" disabled>
        <div class="lighting-presets" role="group" aria-label="Общий свет">
          <button type="button" data-ambient="100" disabled>День</button>
          <button type="button" data-ambient="80" disabled>Вечер</button>
          <button type="button" data-ambient="60" disabled>Темно</button>
        </div>
        <label for="cell-brightness">Яркость кисти <output id="cell-value" for="cell-brightness">100%</output></label>
        <input id="cell-brightness" type="range" min="60" max="120" step="1" value="100" disabled>
        <div class="lighting-presets" role="group" aria-label="Яркость кисти">
          <button type="button" data-brush-light="100" disabled>День</button>
          <button type="button" data-brush-light="80" disabled>Вечер</button>
          <button type="button" data-brush-light="60" disabled>Темно</button>
        </div>
        <p class="lighting-note">Кисть задаёт яркость клетки независимо от общего света. 100% — обычный дневной свет.</p>
        <button type="button" id="reset-lighting" disabled>Сбросить освещение</button>
      </section>
      <div id="mob-palette" class="terrain-list" role="group" aria-label="Выбор моба" hidden>
        <button type="button" class="terrain-option" data-mob="wolf" aria-label="Волк" title="Волк" aria-pressed="true" disabled>
          <img class="mob-swatch" src="assets/mobs/wolf.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="black-wolf" aria-label="Чёрный волк" title="Чёрный волк" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/black-wolf.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="bear" aria-label="Медведь" title="Медведь" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/bear.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="werewolf" aria-label="Оборотень" title="Оборотень" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/werewolf.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="hound" aria-label="Гончая" title="Гончая" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/hound.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="dragon-turtle" aria-label="Драконовая черепаха" title="Драконовая черепаха" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/dragon-turtle.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="hill-giant" aria-label="Холмовой великан" title="Холмовой великан" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/hill-giant.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="giant-toad" aria-label="Гигантская жаба" title="Гигантская жаба" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/giant-toad.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="specter" aria-label="Спектр" title="Спектр" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/specter.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="shadow" aria-label="Тень" title="Тень" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/shadow.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="lake-spirit" aria-label="Дух озера" title="Дух озера" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/lake-spirit.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="nymph" aria-label="Нимфа" title="Нимфа" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/nymph.png" alt="" width="48" height="48" draggable="false">
        </button>
      </div>
      <div id="ally-palette" class="terrain-list" role="group" aria-label="Выбор союзника" hidden>
        <button type="button" class="terrain-option" data-ally="wizard" aria-label="Маг" title="Маг" aria-pressed="true" disabled>
          <img class="mob-swatch" src="assets/mobs/wizard.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-ally="monk" aria-label="Монах" title="Монах" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/monk.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-ally="warrior" aria-label="Воин" title="Воин" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/warrior.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-ally="archer" aria-label="Лучник" title="Лучник" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/archer.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-ally="halfling" aria-label="Полурослик" title="Полурослик" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/halfling.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-ally="druid" aria-label="Друид" title="Друид" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/druid.png" alt="" width="48" height="48" draggable="false">
        </button>
      </div>
      <div id="object-palette" class="terrain-list" role="group" aria-label="Выбор препятствия" hidden>
        <button type="button" class="terrain-option" data-object="crate" aria-label="Ящик" title="Ящик — непроходимое препятствие" aria-pressed="true" disabled>
          <img class="object-swatch" src="assets/objects/crate.png" alt="" width="48" height="48" draggable="false">
        </button>
      </div>
      <div id="small-object-palette" class="terrain-list" role="group" aria-label="Небольшие объекты" hidden>
        <button type="button" class="terrain-option" data-object="torch" aria-label="Горящий факел" title="Горящий факел" aria-pressed="false" disabled><img class="object-swatch" src="assets/objects/torch.png" alt="" width="48" height="48" draggable="false"></button>
        <button type="button" class="terrain-option" data-object="unlit-torch" aria-label="Потухший факел" title="Потухший факел" aria-pressed="false" disabled><img class="object-swatch" src="assets/objects/unlit-torch.png" alt="" width="48" height="48" draggable="false"></button>
        <button type="button" class="terrain-option" data-object="wall-torch" aria-label="Горящий настенный факел" title="Горящий настенный факел — на свободной клетке у стены" aria-pressed="false" disabled><img class="object-swatch" src="assets/objects/wall-torch.png" alt="" width="48" height="48" draggable="false"></button>
        <button type="button" class="terrain-option" data-object="unlit-wall-torch" aria-label="Потухший настенный факел" title="Потухший настенный факел — на свободной клетке у стены" aria-pressed="false" disabled><img class="object-swatch" src="assets/objects/unlit-wall-torch.png" alt="" width="48" height="48" draggable="false"></button>
      </div>
    </aside>
  </main>
  <svg class="selection-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="entity-selection-outline" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="expanded"/>
        <feFlood flood-color="#ffff00" result="yellow"/>
        <feComposite in="yellow" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
</body>
</html>
