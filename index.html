<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Редактор карты</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="editor">
    <div class="editor-toolbar" role="toolbar" aria-label="Панель инструментов">
      <button type="button" id="load-map" class="toolbar-button" aria-label="Загрузить карту" title="Загрузить карту" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M3 19V5h7l2 3h9v4M3 19l3-9h16l-3 9Z"/>
        </svg>
      </button>
      <button type="button" id="save-map" class="toolbar-button" aria-label="Сохранить карту" title="Сохранить карту" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M4 3h13l4 4v14H3V3Z"/>
          <path d="M7 3v6h10V3M7 21v-8h10v8M14 4v3"/>
        </svg>
      </button>
      <button type="button" id="toggle-grid" class="toolbar-button" aria-label="Сетка" aria-pressed="true" aria-controls="map-grid" title="Показать/скрыть сетку">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 3v18M12 3v18M18 3v18M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="terrain" aria-label="Редактирование террейна" title="Редактирование террейна" aria-pressed="true" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="m14 4 3-2 5 5-2 3-8 8-5-5ZM7 14c-5 0-1 6-5 7 6 2 11-1 8-5"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="mobs" aria-label="Размещение мобов" title="Размещение мобов" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <ellipse cx="6" cy="7" rx="2" ry="3"/><ellipse cx="12" cy="5" rx="2" ry="3"/><ellipse cx="18" cy="7" rx="2" ry="3"/>
          <path d="M5 18c0-3 4-8 7-8s7 5 7 8c0 5-5 2-7 2s-7 3-7-2Z"/>
        </svg>
      </button>
      <button type="button" class="toolbar-button" data-mode="objects" aria-label="Непроходимые объекты" title="Непроходимые объекты" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="m3 6 9-3 9 3v13l-9 3-9-3ZM3 6l9 3 9-3M12 9v13M5 10l5 9M5 18l5-7M14 11l5 7M14 19l5-9"/>
        </svg>
      </button>
      <button type="button" id="delete-selection" class="toolbar-button" aria-label="Удалить выделенное" title="Удалить выделенное" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <input type="file" id="map-file" accept=".json,application/json" hidden>
    <section class="map-panel" aria-label="Карта">
      <div class="map-viewport">
        <div class="map-surface" data-mode="terrain" aria-busy="true">
          <canvas id="map" width="576" height="576" tabindex="0" aria-label="Карта 12 на 12 клеток" aria-describedby="keyboard-help"></canvas>
          <div id="map-grid" class="map-grid" aria-hidden="true"></div>
          <div id="object-layer" class="object-layer"></div>
          <div id="mob-layer" class="mob-layer"></div>
          <div id="mob-drop-target" class="mob-drop-target" hidden aria-hidden="true"></div>
          <div id="keyboard-cursor" class="keyboard-cursor" aria-hidden="true"></div>
        </div>
      </div>
      <p id="status" role="status">Загрузка тайлов…</p>
      <span id="keyboard-help" class="sr-only">С клавиатуры: стрелки выбирают клетку, пробел или Enter применяет выбранный террейн, моба или объект.</span>
    </section>
    <aside class="terrain-panel" aria-labelledby="terrain-title">
      <h2 id="terrain-title">Террейн</h2>
      <div id="terrain-palette" class="terrain-list" role="group" aria-label="Выбор террейна">
        <button type="button" class="terrain-option" data-terrain="grass" aria-label="Трава" title="Трава" aria-pressed="true" disabled>
          <span class="terrain-swatch terrain-swatch--grass" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="sand" aria-label="Песок" title="Песок" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--sand" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="dirt" aria-label="Грязь" title="Грязь" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--dirt" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="swamp" aria-label="Болото" title="Болото" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--swamp" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="shallow-water" aria-label="Мелководье" title="Мелководье" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--shallow-water" aria-hidden="true"></span>
        </button>
        <button type="button" class="terrain-option" data-terrain="deep-water" aria-label="Глубоководье" title="Глубоководье" aria-pressed="false" disabled>
          <span class="terrain-swatch terrain-swatch--water" aria-hidden="true"></span>
        </button>
      </div>
      <div id="mob-palette" class="terrain-list" role="group" aria-label="Выбор моба" hidden>
        <button type="button" class="terrain-option" data-mob="wolf" aria-label="Волк" title="Волк" aria-pressed="true" disabled>
          <img class="mob-swatch" src="assets/mobs/wolf.png" alt="" width="48" height="48" draggable="false">
        </button>
        <button type="button" class="terrain-option" data-mob="hill-giant" aria-label="Холмовой великан" title="Холмовой великан" aria-pressed="false" disabled>
          <img class="mob-swatch" src="assets/mobs/hill-giant.png" alt="" width="48" height="48" draggable="false">
        </button>
      </div>
      <div id="object-palette" class="terrain-list" role="group" aria-label="Выбор препятствия" hidden>
        <button type="button" class="terrain-option" data-object="crate" aria-label="Ящик" title="Ящик — непроходимое препятствие" aria-pressed="true" disabled>
          <img class="object-swatch" src="assets/objects/crate.png" alt="" width="48" height="48" draggable="false">
        </button>
      </div>
    </aside>
  </main>
  <svg class="selection-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="entity-selection-outline" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="expanded"/>
        <feFlood flood-color="#0088ff" result="purple"/>
        <feComposite in="purple" in2="expanded" operator="in" result="outline"/>
        <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
</body>
</html>
